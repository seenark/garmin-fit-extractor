name: garmin-fit-extractor

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports:
      - "5432:5432"
    volumes:
      - ./db-data:/var/lib/postgresql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - intranet

  garmin-fit-extractor:
    image: ${GARMIN_FIT_IMAGE:-hadesgod/garmin-fit-extractor}:${GARMIN_FIT_TAG:-latest}
    platform: linux/amd64
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${GARMIN_FIT_PORT:-8100}:3000"
    environment:
      GARMIN_FIT_BIND: ${GARMIN_FIT_BIND:-0.0.0.0:3000}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      GARMIN_FIT_APP_ORIGIN: ${GARMIN_FIT_APP_ORIGIN:-}
      GARMIN_FIT_STATIC_DIR: ${GARMIN_FIT_STATIC_DIR:-/app/public}
      GARMIN_FIT_GOOGLE_CLIENT_ID: ${GARMIN_FIT_GOOGLE_CLIENT_ID:-}
      GARMIN_FIT_GOOGLE_CLIENT_SECRET: ${GARMIN_FIT_GOOGLE_CLIENT_SECRET:-}
      GARMIN_FIT_GOOGLE_REDIRECT_URI: ${GARMIN_FIT_GOOGLE_REDIRECT_URI:-}
      GARMIN_FIT_CHATGPT_CLIENT_ID: ${GARMIN_FIT_CHATGPT_CLIENT_ID:-}
      GARMIN_FIT_CHATGPT_CLIENT_SECRET: ${GARMIN_FIT_CHATGPT_CLIENT_SECRET:-}
      GARMIN_FIT_CHATGPT_REDIRECT_URI: ${GARMIN_FIT_CHATGPT_REDIRECT_URI:-}
      RUST_LOG: ${RUST_LOG:-info}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 30s
    networks:
      - intranet

networks:
  intranet:
    name: intranet
