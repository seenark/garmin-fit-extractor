[package]
name = "legacy-data-migrator"
version = "0.1.0"
edition = "2024"

[lib]
name = "legacy_data_migrator"
path = "src/lib.rs"


[dependencies]
libsqlite3-sys = "0.37.0"
clap = { version = "4.5", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "sqlite", "postgres", "migrate"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[dev-dependencies]
