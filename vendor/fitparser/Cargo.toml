[package]
name = "fitparser"
version = "0.11.0"
edition = "2024"
authors = ["Matthew Stadelman <stadelmanma@gmail.com>"]
description = "MIT fitparser 0.11.0 with bounded FIT component decoding and lossless archive metadata"
license = "MIT"
repository = "https://github.com/stadelmanma/fitparse-rs"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
nom = "8"
serde = { version = "1.0", features = ["derive"] }

[dev-dependencies]
serde_json = "1.0"

[workspace]
